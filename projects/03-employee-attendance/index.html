<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workforce Attendance Control Center</title>
<style>
:root{--bg:#090a0f;--panel:rgba(28,29,38,.78);--line:rgba(255,255,255,.11);--text:#f5f7fb;--muted:#9ca4b7;--orange:#ff7a18;--cyan:#42c7ff;--green:#39d98a;--red:#ff5d73;--yellow:#ffc857}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 72% 0%,#202331 0,#0b0c12 35%,#07080c 100%);color:var(--text);font:14px Inter,Segoe UI,system-ui,sans-serif;min-height:100vh}.shell{display:flex;min-height:100vh}.sidebar{width:236px;padding:22px 14px;background:rgba(12,13,19,.9);border-right:1px solid var(--line);position:sticky;top:0;height:100vh}.brand{font-size:17px;font-weight:800;letter-spacing:.4px;margin:4px 10px 30px}.brand span{display:block;color:var(--orange);font-size:11px;margin-top:5px;letter-spacing:1.5px}.nav-title{font-size:10px;color:#647084;letter-spacing:1.5px;margin:25px 10px 9px}.nav{display:flex;gap:10px;align-items:center;color:#aab1c0;padding:12px 11px;border-radius:12px;margin:4px 0;width:100%;border:1px solid transparent;background:transparent;font:inherit;text-align:left;cursor:pointer;transition:.2s ease}.nav:hover{color:#fff;background:rgba(255,255,255,.07);transform:translateX(2px)}.nav:focus-visible{outline:2px solid var(--orange);outline-offset:2px}.nav.active{background:linear-gradient(110deg,rgba(255,122,24,.22),rgba(255,122,24,.04));color:#fff;border:1px solid rgba(255,122,24,.28)}.nav b{font-size:15px;width:20px;color:var(--orange)}.profile{position:absolute;bottom:20px;left:20px;right:20px;padding:12px;border-top:1px solid var(--line);color:#b8c0ce}.profile small{color:var(--muted)}.main{flex:1;padding:28px 32px;max-width:1600px;margin:auto;width:100%}.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:26px}.eyebrow{color:var(--orange);font-size:11px;font-weight:700;letter-spacing:1.7px;text-transform:uppercase}.title{font-size:31px;margin:7px 0 5px}.sub{color:var(--muted)}.badge{border:1px solid rgba(57,217,138,.35);color:var(--green);padding:9px 13px;border-radius:999px;background:rgba(57,217,138,.08);font-size:12px}.filters{display:flex;gap:9px;margin:18px 0}.filter{background:rgba(255,255,255,.06);border:1px solid var(--line);padding:8px 11px;border-radius:10px;color:#d9deea}.filter select{background:transparent;border:0;color:#fff;font:inherit;outline:0;cursor:pointer}.filter option{background:#171922;color:#fff}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.card,.panel{background:linear-gradient(140deg,rgba(42,44,56,.83),rgba(17,18,26,.72));border:1px solid var(--line);box-shadow:0 12px 34px rgba(0,0,0,.22);backdrop-filter:blur(18px);border-radius:16px}.card{padding:17px}.card .label{color:var(--muted);font-size:12px}.value{font-size:28px;font-weight:800;margin:12px 0 5px}.change{font-size:11px;color:var(--green)}.layout{display:grid;grid-template-columns:1.65fr 1fr;gap:14px;margin-top:14px}.panel{padding:19px;min-height:270px}.panel h3{font-size:14px;margin:0 0 16px}.panel h3 span{float:right;color:var(--muted);font-size:11px;font-weight:400}.chart{height:205px;display:flex;align-items:end;gap:5px;padding:12px 3px 25px;border-bottom:1px solid var(--line);position:relative}.bar{flex:1;min-width:3px;background:linear-gradient(180deg,var(--cyan),rgba(66,199,255,.08));border-radius:5px 5px 0 0;box-shadow:0 0 13px rgba(66,199,255,.25)}.axis{display:flex;justify-content:space-between;color:#737c8e;font-size:10px;margin-top:8px}.donut-wrap{display:flex;align-items:center;gap:26px;height:210px}.donut{width:164px;height:164px;border-radius:50%;background:conic-gradient(var(--green) 0 90.8%,var(--red) 90.8% 94.8%,var(--yellow) 94.8% 100%);position:relative}.donut:after{content:'90.8%';position:absolute;inset:26px;background:#171922;border-radius:50%;display:grid;place-items:center;font-size:27px;font-weight:800}.legend{display:grid;gap:13px;color:#bfc5d2;font-size:12px}.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px}.bottom{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;margin-top:14px}.table{width:100%;border-collapse:collapse;font-size:12px}.table th{color:#798295;text-align:left;font-weight:500;padding:8px;border-bottom:1px solid var(--line)}.table td{padding:11px 8px;border-bottom:1px solid rgba(255,255,255,.06)}.pill{padding:4px 8px;border-radius:999px;font-size:10px}.good{color:var(--green);background:rgba(57,217,138,.12)}.warn{color:var(--yellow);background:rgba(255,200,87,.12)}.mini-bars{display:grid;gap:12px}.mini-line{display:grid;grid-template-columns:120px 1fr 45px;align-items:center;gap:10px;color:#bbc2cf;font-size:12px}.track{height:8px;background:#292c37;border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--orange),var(--yellow));border-radius:99px}.foot{color:#667083;font-size:11px;margin-top:20px}.synthetic{color:var(--yellow)}
@media(max-width:1050px){.grid{grid-template-columns:repeat(3,1fr)}.layout,.bottom{grid-template-columns:1fr}}@media(max-width:700px){.sidebar{display:none}.main{padding:20px 15px}.grid{grid-template-columns:repeat(2,1fr)}.top{display:block}.badge{display:inline-block;margin-top:15px}.title{font-size:26px}}
.filterbar{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.filter{background:rgba(255,255,255,.06);border:1px solid var(--line);padding:8px 10px;border-radius:10px;color:#d9deea}.filter select,.filter input{background:transparent;border:0;color:#fff;font:inherit;outline:0}.filter option{background:#171922}.btn{background:#ffffff0a;border:1px solid var(--line);color:#fff;padding:8px 11px;border-radius:10px;cursor:pointer}.btn:hover{border-color:var(--orange)}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}.metric{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #ffffff12;color:#bbc2cf}.metric strong{color:#fff}.table-wrap{overflow:auto}.empty{padding:30px;text-align:center;color:var(--muted)}.report-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.bad{color:var(--red);background:#ff63791c}.credit{position:static;margin:0 10px 24px;padding:0 0 14px;border-bottom:1px solid var(--line);color:#b8c0ce}.credit strong{font-size:12px}.credit small{color:var(--muted)}
 </style></head>
<body><div class="shell"><aside class="sidebar"><div class="brand">Attendance Dashboard<span>WORKFORCE ANALYTICS</span></div><div class="credit"><strong>Created By Aornob</strong><br><small>* Synthetic data only</small></div><div class="nav-title">MENU</div><button class="nav active" data-page="overview"><b>◈</b><span>Overview</span></button><button class="nav" data-page="attendance"><b>⌁</b><span>Attendance</span></button><button class="nav" data-page="employees"><b>◎</b><span>Employees</span></button><button class="nav" data-page="leave"><b>▣</b><span>Leave & Absence</span></button><button class="nav" data-page="shift"><b>◴</b><span>Shift Analytics</span></button><button class="nav" data-page="reports"><b>▥</b><span>Reports</span></button><div class="nav-title">SYSTEM</div><button class="nav" data-page="filters"><b>⚙</b><span>Filters</span></button><button class="nav" data-page="settings"><b>◌</b><span>Settings</span></button></aside><main class="main"><header class="top"><div><div class="eyebrow" id="eyebrow">ATTENDANCE CONTROL CENTER</div><div class="title" id="title">Workforce Overview</div><div class="sub" id="subtitle">Date range: Jan 2024 - Dec 2026</div></div><div class="badge">● Live filtered model</div></header><div class="filterbar"><label class="filter">Year <select id="year"><option value="All">All years</option></select></label><label class="filter">Month <select id="month"><option value="All">All months</option></select></label><label class="filter">Department <select id="department"><option value="All">All departments</option></select></label><label class="filter">Supervisor <select id="supervisor"><option value="All">All supervisors</option></select></label><label class="filter">Shift <select id="shift"><option value="All">All shifts</option></select></label><label class="filter">From <input id="from" type="date" min="2024-01-01" max="2026-12-31"></label><label class="filter">To <input id="to" type="date" min="2024-01-01" max="2026-12-31"></label><button class="btn" id="reset">Reset filters</button></div><section class="grid" id="kpis"></section><section class="content" id="page"></section><div class="foot">* Synthetic public demonstration data only. No private workbook data, names, or records are used.</div></main></div>
<script>
const state={rows:[],page:'overview'};const $=id=>document.getElementById(id);const meta={overview:['ATTENDANCE CONTROL CENTER','Workforce Overview','Date range: Jan 2024 - Dec 2026'],attendance:['ATTENDANCE','Attendance Analytics','Filtered attendance records'],employees:['EMPLOYEES','Employee Directory','Synthetic employee IDs only'],leave:['LEAVE & ABSENCE','Leave and absence analysis','Filtered status records'],shift:['SHIFT ANALYTICS','Shift Performance','Filtered shift records'],reports:['REPORTS','Connected Report Builder','Export or inspect the active filter set'],filters:['SYSTEM','Filter Center','Every control updates the KPIs and all report pages'],settings:['SYSTEM','Dashboard Settings','Public synthetic demonstration model']};
function parseCSV(t){const lines=t.trim().split(/\r?\n/),head=lines.shift().split(',');return lines.map(line=>{const cells=line.split(','),r={};head.forEach((h,i)=>r[h]=cells[i]||'');return r})}function vals(key){return [...new Set(state.rows.map(r=>r[key]))].filter(Boolean).sort()}function fill(id,items,all){$(id).innerHTML='<option value="All">'+all+'</option>'+items.map(x=>'<option>'+x+'</option>').join('')}function filters(){const y=$('year').value,m=$('month').value,d=$('department').value,s=$('supervisor').value,sh=$('shift').value,f=$('from').value,t=$('to').value;return state.rows.filter(r=>(y==='All'||r.Year===y)&&(m==='All'||r.Month===m)&&(d==='All'||r.Department===d)&&(s==='All'||r.Supervisor===s)&&(sh==='All'||r.Shift===sh)&&(!f||r.Date>=f)&&(!t||r.Date<=t))}function calc(rows){const n=k=>rows.reduce((a,r)=>a+Number(r[k]||0),0),scheduled=n('Scheduled'),present=n('Present'),absent=n('Absent'),leave=n('Leave'),late=n('Late');return{scheduled,present,absent,leave,late,rate:scheduled?present/scheduled*100:0,employees:new Set(rows.map(r=>r.EmployeeID)).size,work:rows.reduce((a,r)=>a+Number(r.WorkHours||0),0)}}function pct(x){return x.toFixed(1)+'%'}function group(rows,key){const out={};rows.forEach(r=>{out[r[key]]??={s:0,p:0,a:0,l:0,n:0};out[r[key]].s+=Number(r.Scheduled);out[r[key]].p+=Number(r.Present);out[r[key]].a+=Number(r.Absent);out[r[key]].l+=Number(r.Leave);out[r[key]].n++});return out}function rowsTable(rows,limit=50){if(!rows.length)return '<div class="empty">No records match the active filters.</div>';return '<div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Employee ID</th><th>Department</th><th>Supervisor</th><th>Shift</th><th>Status</th><th>Work hours</th></tr></thead><tbody>'+rows.slice(0,limit).map(r=>`<tr><td>${r.Date}</td><td>${r.EmployeeID}</td><td>${r.Department}</td><td>${r.Supervisor}</td><td>${r.Shift}</td><td><span class="pill ${r.Status==='Present'||r.Status==='Late'?'good':r.Status==='Absent'?'bad':'warn'}">${r.Status}</span></td><td>${r.WorkHours}</td></tr>`).join('')+'</tbody></table></div>'}
function renderKpis(c){$('kpis').innerHTML=[['Attendance rate',pct(c.rate),'Connected to scheduled records'],['Employees',c.employees,'Unique synthetic IDs'],['Present (incl. late)',c.present.toLocaleString(),'Filtered records'],['Absent records',c.absent.toLocaleString(),'Filtered records'],['Leave records',c.leave.toLocaleString(),'Filtered records']].map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="value">${x[1]}</div><div class="delta">● ${x[2]}</div></div>`).join('')}
function statusMix(rows){const scheduled=rows.filter(r=>r.Scheduled==='1'),counts={Present:0,Absent:0,Leave:0,Late:0};scheduled.forEach(r=>{if(counts[r.Status]!==undefined)counts[r.Status]++});const total=scheduled.length;return '<div class="mini-bars">'+Object.entries(counts).map(([k,n])=>{const rate=total?n/total*100:0;return `<div class="mini-line"><span>${k}</span><div class="track"><div class="fill" style="width:${rate}%"></div></div><strong>${pct(rate)}</strong></div>`}).join('')+'</div>'}
function trend(rows){const g={};rows.forEach(r=>{const k=r.Date.slice(0,7);g[k]??={s:0,p:0};g[k].s+=Number(r.Scheduled);g[k].p+=Number(r.Present)});const e=Object.entries(g).sort();if(!e.length)return '<div class="empty">No data</div>';const max=Math.max(1,...e.map(x=>x[1].s?x[1].p/x[1].s:0));return `<div class="chart">${e.map(([k,v])=>`<div class="bar" title="${k} ${pct(v.p/v.s*100)}" style="height:${Math.max(8,(v.p/v.s)/max*100)}%"></div>`).join('')}</div><div class="axis"><span>${e[0][0]}</span><span>${e[Math.floor(e.length/2)][0]}</span><span>${e[e.length-1][0]}</span></div>`}
function pageOverview(rows,c){const absent=c.scheduled?c.absent/c.scheduled*100:0,leave=c.scheduled?c.leave/c.scheduled*100:0;return `<div class="layout"><div class="panel"><h3>Attendance trend <span>${rows.length.toLocaleString()} filtered rows</span></h3>${trend(rows)}</div><div class="panel"><h3>Attendance distribution <span>Current filters</span></h3><div class="donut-wrap"><div class="donut" data-label="${pct(c.rate)}" style="background:conic-gradient(var(--green) 0 ${c.rate}%,var(--red) ${c.rate}% ${c.rate+absent}%,var(--yellow) ${c.rate+absent}% 100%)"></div><div class="legend"><div><i style="background:var(--green)"></i>Present incl. late <strong>${pct(c.rate)}</strong></div><div><i style="background:var(--red)"></i>Absent <strong>${pct(absent)}</strong></div><div><i style="background:var(--yellow)"></i>Leave <strong>${pct(leave)}</strong></div></div></div></div></div><div class="bottom"><div class="panel"><h3>Department performance</h3>${bars(rows,'Department')}</div><div class="panel"><h3>Supervisor performance</h3>${bars(rows,'Supervisor')}</div><div class="panel"><h3>Live filter summary</h3><div class="metric"><span>Scheduled</span><strong>${c.scheduled.toLocaleString()}</strong></div><div class="metric"><span>Late records</span><strong>${c.late.toLocaleString()}</strong></div><div class="metric"><span>Average work hours</span><strong>${(c.work/(rows.length||1)).toFixed(2)}</strong></div></div></div>`}
function pageAttendance(rows){return `<div class="layout"><div class="panel"><h3>Monthly attendance trend <span>All active filters</span></h3>${trend(rows)}</div><div class="panel"><h3>Status totals <span>Scheduled records only</span></h3>${statusMix(rows)}</div></div><div class="panel" style="margin-top:14px"><h3>Attendance records <span>${rows.length.toLocaleString()} rows</span></h3>${rowsTable(rows,80)}</div>`}function pageEmployees(rows){const g=group(rows,'EmployeeID');const sorted=Object.entries(g).sort((a,b)=>(b[1].p/(b[1].s||1))-(a[1].p/(a[1].s||1)));return `<div class="panel"><h3>Employee-level performance <span>IDs only, no personal names</span></h3><div class="table-wrap"><table class="table"><thead><tr><th>Employee ID</th><th>Records</th><th>Scheduled</th><th>Present</th><th>Attendance rate</th><th>Absent</th><th>Leave</th></tr></thead><tbody>${sorted.map(([k,v])=>`<tr><td>${k}</td><td>${v.n}</td><td>${v.s}</td><td>${v.p}</td><td>${pct(v.s?v.p/v.s*100:0)}</td><td>${v.a}</td><td>${v.l}</td></tr>`).join('')}</tbody></table></div></div>`}function pageLeave(rows){return `<div class="layout"><div class="panel"><h3>Leave and absence by department</h3>${bars(rows,'Department')}</div><div class="panel"><h3>Current status mix <span>Scheduled records only</span></h3>${statusMix(rows)}</div></div><div class="panel" style="margin-top:14px"><h3>Leave and absence records</h3>${rowsTable(rows.filter(r=>r.Status==='Leave'||r.Status==='Absent'),100)}</div>`}function pageShift(rows){return `<div class="three">${['Morning','Evening','Night'].map(s=>{const c=calc(rows.filter(r=>r.Shift===s));return `<div class="panel"><h3>${s} shift</h3><div class="value">${pct(c.rate)}</div><div class="metric"><span>Present</span><strong>${c.present.toLocaleString()}</strong></div><div class="metric"><span>Absent</span><strong>${c.absent.toLocaleString()}</strong></div><div class="metric"><span>Late</span><strong>${c.late.toLocaleString()}</strong></div></div>`}).join('')}</div><div class="panel" style="margin-top:14px"><h3>Shift comparison</h3>${bars(rows,'Shift')}</div>`}function pageReports(rows,c){return `<div class="panel"><div class="report-head"><h3>Connected report output</h3><button class="btn" id="download">Download filtered CSV</button></div><div class="three"><div class="metric"><span>Rows in report</span><strong>${rows.length.toLocaleString()}</strong></div><div class="metric"><span>Attendance rate</span><strong>${pct(c.rate)}</strong></div><div class="metric"><span>Active filters</span><strong>${activeCount()}</strong></div></div><div style="margin-top:15px">${rowsTable(rows,100)}</div></div>`}function activeCount(){return ['year','month','department','supervisor','shift','from','to'].filter(id=>$(id).value&&$(id).value!=='All').length}function pageFilters(){return `<div class="panel"><h3>Interactive filter center</h3><p style="color:var(--muted)">Change any selector above. Every page, KPI, chart, table and report uses the same filtered dataset.</p><div class="three"><div class="metric"><span>Selected filters</span><strong>${activeCount()}</strong></div><div class="metric"><span>Data source</span><strong>Public synthetic CSV</strong></div><div class="metric"><span>Private workbook</span><strong>Not used</strong></div></div></div>`}function pageSettings(){return `<div class="three"><div class="panel"><h3>Data protection</h3><p style="color:var(--muted)">Only generated demonstration records are published. No private workbook names or records are included.</p></div><div class="panel"><h3>Coverage</h3><p style="color:var(--muted)">January 2024 through December 2026, with linked date, status, department and shift metrics.</p></div><div class="panel"><h3>Author</h3><p style="color:var(--muted)">Created By Aornob</p></div></div>`}
function render(){const rows=filters(),c=calc(rows),m=meta[state.page];$('eyebrow').textContent=m[0];$('title').textContent=m[1];$('subtitle').textContent=m[2];renderKpis(c);const pages={overview:pageOverview,attendance:pageAttendance,employees:pageEmployees,leave:pageLeave,shift:pageShift,reports:pageReports,filters:pageFilters,settings:pageSettings};$('page').innerHTML=pages[state.page](rows,c);document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));if(state.page==='reports')$('download').onclick=()=>{const head=Object.keys(state.rows[0]||{});const csv=[head.join(','),...rows.map(r=>head.map(h=>r[h]).join(','))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='filtered_attendance_report.csv';a.click()}}
function bind(){['year','month','department','supervisor','shift','from','to'].forEach(id=>$(id).addEventListener('change',render));$('reset').onclick=()=>{['year','month','department','supervisor','shift'].forEach(id=>$(id).value='All');$('from').value='';$('to').value='';render()};document.querySelectorAll('.nav').forEach(b=>b.addEventListener('click',()=>{state.page=b.dataset.page;render()}))}
fetch('data/attendance_2024_2026.csv').then(r=>r.text()).then(t=>{state.rows=parseCSV(t);fill('year',vals('Year'),'All years');fill('month',vals('Month'),'All months');fill('department',vals('Department'),'All departments');fill('supervisor',vals('Supervisor'),'All supervisors');fill('shift',vals('Shift'),'All shifts');bind();render()}).catch(err=>{$('page').innerHTML='<div class="panel">Unable to load public synthetic dataset.</div>';console.error(err)});
</script></body></html>
